[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-capability"
version = "0.1.0"
description = "Visual-only computer use with typed deterministic capabilities"
requires-python = ">=3.11"
dependencies = ["playwright>=1.50,<2", "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pytesseract>=0.3.13,<1", "opencv-python-headless>=4.10,<5", "Pillow>=11,<13", "numpy>=2,<3", "httpx>=0.28,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.16,<1"]

[project.scripts]
visual-agent = "visual_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
